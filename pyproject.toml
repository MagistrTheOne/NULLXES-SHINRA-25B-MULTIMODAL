[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nullxes-shinra"
version = "0.1.0"
description = "NULLXES native dense multimodal SHINRA architecture"
requires-python = ">=3.11"
dependencies = ["safetensors>=0.4", "sentencepiece>=0.2", "protobuf>=4.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.9"]

[project.scripts]
shinra-audit = "shinra.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
